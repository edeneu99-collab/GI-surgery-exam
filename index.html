<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GI Surgery – Study Hub</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2c6b66">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="GI Hub">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">

<style>
:root{
  --bg:#faf8f4;--surface:#fffefb;--surface2:#f3efe7;--ink:#1f1d1a;--ink2:#5b5750;--line:#e2ddd2;
  --accent:#2c6b66;--accent-ink:#ffffff;--accent-soft:#e2eeec;--ok:#2f7d4f;--ok-soft:#e1f0e6;--bad:#b0402f;--bad-soft:#f6e3df;--warn:#8a6415;--warn-soft:#f6ecd3;
  --serif:Charter,"Iowan Old Style","Palatino Linotype",Georgia,"Times New Roman",serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#161513;--surface:#1e1c1a;--surface2:#262421;--ink:#ece8e1;--ink2:#a9a398;--line:#35322d;
    --accent:#6fb3ab;--accent-ink:#0f1b1a;--accent-soft:#1f3230;--ok:#7cc493;--ok-soft:#1c2e22;--bad:#e58a78;--bad-soft:#38221e;--warn:#e0b862;--warn-soft:#352c17;
  }
}
:root[data-theme="dark"]{
  --bg:#161513;--surface:#1e1c1a;--surface2:#262421;--ink:#ece8e1;--ink2:#a9a398;--line:#35322d;
  --accent:#6fb3ab;--accent-ink:#0f1b1a;--accent-soft:#1f3230;--ok:#7cc493;--ok-soft:#1c2e22;--bad:#e58a78;--bad-soft:#38221e;--warn:#e0b862;--warn-soft:#352c17;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding-top:10px;padding-bottom:10px}
h1{font-family:var(--serif);font-size:1.15rem;margin:0;font-weight:600;letter-spacing:.1px}
h1 span{color:var(--ink2);font-weight:400}
.tabs{display:flex;gap:4px;flex:1 1 auto;order:3;width:100%}
@media (min-width:640px){.tabs{order:0;width:auto}}
.tab{flex:1 1 0;background:none;border:1px solid transparent;border-radius:8px;padding:7px 10px;color:var(--ink2);font-weight:500}
.tab[aria-selected="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-soft)}
.tools{display:flex;gap:6px;margin-left:auto}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-size:.9rem;color:var(--ink)}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{padding:4px 9px;font-size:.82rem}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:default}
main{padding:20px 0 60px}
h2{font-family:var(--serif);font-size:1.45rem;margin:.2em 0 .5em;font-weight:600}
h3{font-family:var(--serif);font-size:1.12rem;margin:1.3em 0 .4em;font-weight:600}
.muted{color:var(--ink2)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin:10px 0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grow{flex:1 1 auto}
.badge{display:inline-block;font-size:.72rem;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--surface2);color:var(--ink2);border:1px solid var(--line);white-space:nowrap}
.badge.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.badge.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.badge.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.badge.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
label.inline{display:inline-flex;align-items:center;gap:6px}
input[type=date],input[type=number],input[type=search],input[type=text],textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:auto;max-width:100%}
textarea{width:100%;min-height:80px;resize:vertical;line-height:1.45}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);flex:none}
/* plan */
.day h3{margin:0 0 6px;font-family:var(--sans);font-size:1rem}
.day h3 small{color:var(--ink2);font-weight:400;margin-left:6px}
.topic{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.topic:first-of-type{border-top:0}
.topic .tt{font-family:var(--serif);font-size:1.02rem}
.topic .note{font-size:.84rem;color:var(--ink2);margin-top:2px}
.topic.done .tt{text-decoration:line-through;color:var(--ink2)}
.prog{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.prog>i{display:block;height:100%;background:var(--accent)}
/* reading */
.reading{font-family:var(--serif);font-size:1.05rem;line-height:1.6}
.reading p{margin:.7em 0}
.reading h4{font-family:var(--sans);font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin:1.5em 0 .5em}
.reading ul{margin:.3em 0 .8em;padding-left:1.2em}
.reading li{margin:.2em 0}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);-webkit-overflow-scrolling:touch}
.tw table{border-collapse:collapse;width:100%;min-width:480px;font-size:.95rem}
.tw th,.tw td{text-align:left;vertical-align:top;padding:8px 10px;border-bottom:1px solid var(--line)}
.tw th{font-family:var(--sans);font-size:.78rem;background:var(--surface2);color:var(--ink2);font-weight:600;white-space:nowrap}
.tw tr:last-child td{border-bottom:0}
.tw td:first-child{font-weight:600}
ol.flow{list-style:none;margin:.3em 0 1em;padding:0;counter-reset:s}
ol.flow li{position:relative;counter-increment:s;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:8px;padding:8px 12px 8px 40px;margin:0 0 20px}
ol.flow li::before{content:counter(s);position:absolute;left:10px;top:8px;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font:600 .8rem var(--sans);display:flex;align-items:center;justify-content:center}
ol.flow li:not(:last-child)::after{content:"↓";position:absolute;left:14px;bottom:-21px;color:var(--accent);font:700 1rem var(--sans);line-height:1}
ol.flow li:last-child{margin-bottom:6px}
.callout{background:var(--warn-soft);border-left:4px solid var(--warn);border-radius:8px;padding:9px 12px;margin:1em 0;font-size:.98rem}
.crumbs{font-size:.9rem;margin-bottom:8px}
.crumbs button{background:none;border:0;color:var(--accent);padding:0;text-decoration:underline}
.ch h2{margin-top:1.2em}
.subrow{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:11px 14px;margin:6px 0}
.subrow:hover{background:var(--surface2)}
.subrow .n{font-weight:700;color:var(--accent);min-width:2.4em}
.subrow .t{font-family:var(--serif);font-size:1.05rem}
/* quiz */
.qtext{font-family:var(--serif);font-size:1.15rem;line-height:1.45;margin:.6em 0 1em}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:11px 13px;font-family:var(--serif);font-size:1.02rem}
.opt:hover:not([disabled]){background:var(--surface2)}
.opt .l{font:700 .85rem var(--sans);color:var(--ink2);min-width:1.2em;padding-top:2px}
.opt.ok{background:var(--ok-soft);border-color:var(--ok)}
.opt.bad{background:var(--bad-soft);border-color:var(--bad)}
.opt[disabled]{cursor:default;color:var(--ink)}
.expl{margin-top:12px;padding:10px 12px;border-radius:8px;background:var(--surface2);font-size:.95rem}
.score{font-family:var(--serif);font-size:2.4rem;margin:.2em 0}
/* oral */
.q{font-family:var(--serif);font-size:1.08rem;line-height:1.45}
.ans{font-family:var(--serif);font-size:1.02rem;line-height:1.55;margin-top:8px;padding:10px 12px;background:var(--surface2);border-radius:8px}
.ans p{margin:.4em 0}
.src{font:.85rem var(--sans);color:var(--ink2);margin-top:8px}
.src b{color:var(--ink)}
.gap{margin-top:8px;padding:8px 10px;border-radius:8px;font-size:.88rem;background:var(--warn-soft);color:var(--ink);border-left:4px solid var(--warn)}
.gap.none{background:var(--bad-soft);border-left-color:var(--bad)}
.gap.conflict{background:var(--bad-soft);border-left-color:var(--bad)}
.fc{min-height:220px;display:flex;flex-direction:column}
.fc .q{font-size:1.25rem}
.star{background:none;border:0;font-size:1.3rem;line-height:1;padding:4px 6px;color:var(--ink2)}
.star[aria-pressed="true"]{color:var(--warn)}
.field{display:block;margin:8px 0}
.field span{display:block;font-size:.8rem;color:var(--ink2);margin-bottom:3px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:92vw}
#toast.on{opacity:1}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:flex;align-items:flex-start;justify-content:center;padding:calc(20px + env(safe-area-inset-top,0px)) 12px 20px;overflow:auto}
.modal{background:var(--surface);border-radius:12px;max-width:640px;width:100%;padding:16px;border:1px solid var(--line)}
.modal textarea{min-height:160px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.8rem}
@media (max-width:520px){.tools .btn .lbl{display:none}.card{padding:12px}}

.qhead{margin-top:10px;font:600 .78rem var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.topichead{font-family:var(--serif);font-size:1.25rem;margin:1.6em 0 .2em;padding-bottom:4px;border-bottom:2px solid var(--accent-soft);color:var(--ink)}
select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;max-width:100%}

.sltag{display:inline-block;font:700 .66rem var(--sans);letter-spacing:.05em;text-transform:uppercase;padding:1px 7px;border-radius:99px;background:#dfe6f7;color:#33478a;vertical-align:middle;margin-right:4px}
:root[data-theme="dark"] .sltag{background:#26304f;color:#a9bbf0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sltag{background:#26304f;color:#a9bbf0}}
.callout.disc{background:var(--bad-soft);border-left-color:var(--bad)}

.shtag{display:inline-block;font:700 .66rem var(--sans);letter-spacing:.05em;text-transform:uppercase;padding:1px 7px;border-radius:99px;background:#e3f0e4;color:#2c6a3a;vertical-align:middle;margin-right:4px}
:root[data-theme="dark"] .shtag{background:#1f3324;color:#9bd3a8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .shtag{background:#1f3324;color:#9bd3a8}}

:root{--hl:#ffe98a;--hlink:#1f1d1a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--hl:#7a6a1c;--hlink:#fdf6d0}}
:root[data-theme="dark"]{--hl:#7a6a1c;--hlink:#fdf6d0}
mark{background:var(--hl);color:var(--hlink);padding:0 .15em;border-radius:3px}
.rtb{display:flex;gap:6px;margin-bottom:4px;flex-wrap:wrap}
.hlb{background:#fff176;color:#1f1d1a;padding:0 .35em;border-radius:3px;font-weight:700}
.rte{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-family:var(--serif);font-size:1.02rem;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere;max-width:100%}
.rte:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.rte mark{background:var(--hl);color:var(--hlink);padding:0 .1em;border-radius:3px}

[hidden]{display:none!important}

</style>
</head>
<body>
<header class="top"><div class="wrap">
  <h1>GI Surgery <span>study hub</span></h1>
  <nav class="tabs" role="tablist" aria-label="Sections">
    <button class="tab" role="tab" data-a="tab" data-tab="plan" aria-selected="true">Plan</button>
    <button class="tab" role="tab" data-a="tab" data-tab="read" aria-selected="false">Read &amp; quiz</button>
    <button class="tab" role="tab" data-a="tab" data-tab="oral" aria-selected="false">Oral practice</button>
  </nav>
  <div class="tools">
    <button class="btn primary" data-a="install" id="installBtn" hidden>Install app</button>
    <button class="btn" data-a="theme" aria-label="Change theme" title="Theme: auto / light / dark">◐</button>
    <button class="btn" data-a="export" title="Download your data as JSON">Export</button>
    <button class="btn" data-a="import" title="Load a previous export">Import</button>
  </div>
</div></header>
<main id="app"></main>
<div id="toast" role="status" aria-live="polite"></div>
<script>
const CHAPTERS=[];
const P=(x)=>({t:'p',x});
const UL=(h,items)=>({t:'ul',h,items});
const TB=(h,cols,rows)=>({t:'tb',h,cols,rows});
const FL=(h,steps)=>({t:'fl',h,steps});
const NOTE=(x)=>({t:'note',x});
const Q=(q,a,w,e)=>({q,opts:[a,...w],e});
const sub=(id,title,pages,blocks,mcqs)=>({id,title,pages,blocks,mcqs});
CHAPTERS.push({id:'c1', title:'1. ESOPHAGEAL PATHOLOGIES', subs:[

sub('1.1','Achalasia','pp.1–3',[
P('Rare esophageal motility disorder: the lower esophageal sphincter (LES) cannot relax properly and the esophageal body has no normal peristalsis. Result: functional obstruction at the gastroesophageal junction → dysphagia and regurgitation.'),
TB('Pathophysiology',['Mechanism','What happens'],[
 ['Impaired LES relaxation','Degeneration of inhibitory neurons in the myenteric plexus'],
 ['Aperistalsis','No coordinated contraction of the esophageal body → poor propulsion'],
 ['Post-viral','Herpes Zoster detected in esophageal tissue; may damage enteric ganglion cells → chronic inflammation, neuronal loss'],
 ['Neural degeneration','Loss of inhibitory neurons containing VIP and nitric oxide']]),
UL('Symptoms',['**Dysphagia** – solids first, later liquids','**Regurgitation** of undigested food/saliva → aspiration pneumonia','Chest pain (heartburn-like, from spasm)','Weight loss','Nocturnal cough (aspiration during sleep)']),
TB('Diagnosis',['Test','Finding / role'],[
 ['Barium swallow','“Bird’s beak” (smooth tapering of distal esophagus); dilated esophagus, delayed emptying. Dilation >6 cm = long-standing disease, predicts worse response to Heller myotomy'],
 ['Esophageal manometry','**Gold standard.** Incomplete LES relaxation + absent peristalsis. Thin nasal catheter, patient swallows water, pressure map'],
 ['Endoscopy (EGD)','Excludes cancer / strictures; may show retained food or liquid']]),
FL('Treatment ladder',['Medical: calcium-channel blockers, nitrates (limited effect, poorly tolerated)','Endoscopic: botulinum toxin (temporary, repeat every 6–12 months, for elderly/unfit) or pneumatic dilation (may need repeats)','POEM: endoscopic tunnel, cut inner circular muscle at LES','Surgery: Heller myotomy + Dor fundoplication']),
TB('Which treatment for which severity',['Severity / type','Recommended'],[
 ['Mild / early','Medical therapy or botulinum toxin (if unfit for procedures)'],
 ['Moderate (type I & II)','Pneumatic dilation or Heller-Dor surgery'],
 ['Type III (spastic)','POEM preferred – allows a longer, tailored myotomy'],
 ['End-stage / sigmoid (>6 cm)','Surgery may fail → consider esophagectomy or palliation']]),
FL('Heller-Dor procedure',['Heller myotomy: longitudinal incision through the hypertonic distal esophageal muscle, extending 2–3 cm onto the stomach; ~10 cm long, 4–5 cm above the diaphragm','Dor fundoplication: anterior hemifundoplication – fundus mobilized, flipped over the myotomy, closed with two rows of stitches','Flap secured to the diaphragmatic hiatus (prevents migration and reflux)']),
UL('Why the Dor is added',['Covers and reinforces the myotomy → prevents perforation and recurrence','Anti-reflux mechanism after LES widening']),
NOTE('POEM: minimally invasive, no external incisions, suitable for types I–III, faster recovery – but higher risk of post-procedure reflux than Heller-Dor. Heller + endoscopic dilation: 97% long-term relief. Incomplete myotomy (often at the gastric end) causes failure; results are less favourable when sigmoid esophagus >6 cm.'),
UL('Complications',['Esophageal perforation (pneumatic dilation, surgical myotomy)','GERD after myotomy (reduced LES pressure)','Aspiration pneumonia','Megaesophagus in advanced untreated disease']),
TB('Pediatric vs adult',['Feature','Pediatric','Adult'],[
 ['Cause','Often idiopathic or syndromic (Allgrove / Triple A)','Mostly idiopathic'],
 ['Presentation','Failure to thrive, vomiting, food refusal, cough','Dysphagia, regurgitation, chest pain'],
 ['Diagnosis','Manometry harder in small children; EndoFLIP more useful','Standard manometry; EndoFLIP if manometry unavailable'],
 ['Treatment','POEM & Heller; dilation less durable','POEM, dilation or surgery all common'],
 ['Recurrence','Higher – close follow-up','Lower if properly treated']])
],[
Q('What is the basic functional defect in achalasia?','Failure of LES relaxation plus absent esophageal peristalsis',['Inappropriate LES relaxation allowing reflux','Absent peristalsis with normal LES relaxation','Herniation of mucosa through a weak esophageal wall'],'Achalasia = LES does not relax + aperistalsis → functional obstruction at the GEJ [§1.1, p.1].'),
Q('Which neurons degenerate in achalasia?','Inhibitory neurons containing VIP and nitric oxide',['Motor neurons of the cricopharyngeus','Somatostatin-secreting D cells','Goblet-cell precursors in the myenteric plexus'],'Loss of VIP/NO inhibitory neurons in the myenteric plexus prevents LES relaxation [§1.1, p.1].'),
Q('Which virus has been detected in esophageal tissue in achalasia?','Herpes Zoster',['Epstein-Barr virus','Cytomegalovirus','Human papillomavirus'],'The summary lists a post-viral mechanism with Herpes Zoster. EBV, CMV and HPV appear elsewhere in the summaries for other diseases [§1.1, p.1].'),
Q('Which barium swallow appearance is classic for achalasia?','“Bird’s beak” narrowing of the distal esophagus',['Pouch at the back of the esophagus above the UES','Irregular shouldered filling defect with strictures','Sliding of the GEJ above the diaphragm'],'Smooth tapering of the distal esophagus = bird’s beak, with dilated esophagus and delayed emptying [§1.1, p.1].'),
Q('What is the gold standard test for diagnosing achalasia?','Esophageal manometry',['Barium swallow','Upper endoscopy (EGD)','24-hour pH monitoring'],'Manometry shows incomplete LES relaxation and absent peristalsis [§1.1, p.1].'),
Q('What is the role of EGD in a patient with suspected achalasia?','Exclude cancer or strictures and look for retained food',['Measure LES relaxation pressure','Show the bird’s beak sign','Cut the LES muscle'],'EGD is used to exclude other conditions such as esophageal cancer or strictures [§1.1, p.1].'),
Q('An esophageal dilation >6 cm on barium swallow suggests:','Long-standing disease with a worse response to Heller myotomy',['Early disease with an excellent response to Heller myotomy','An epiphrenic diverticulum','Type III achalasia needing POEM'],'>6 cm = long-standing disease, may predict worse response; sigmoid esophagus >6 cm → surgery may fail [§1.1, pp.1–2].'),
Q('Which describes the Heller myotomy as given in the summary?','~10 cm longitudinal incision, 4–5 cm above the diaphragm, extending 2–3 cm onto the stomach',['~2–3 cm incision limited to the LES, fully above the diaphragm','~10 cm circular incision through the mucosa only','A 360° incision of the esophagus at the GEJ'],'Longitudinal incision through hypertonic muscle, extending 2–3 cm into the stomach; typically 10 cm long, 4–5 cm above the diaphragm [§1.1, p.2].'),
Q('Dor fundoplication in achalasia surgery is:','An anterior hemifundoplication covering the myotomy',['A 360° wrap around the lower esophagus','A 270° posterior wrap for poor motility','A magnetic bead ring around the LES'],'Dor = anterior (180°) hemifundoplication that covers the myotomy and acts as anti-reflux mechanism [§1.1 p.2; §1.3 p.7].'),
Q('Which achalasia type is best treated with POEM?','Type III (spastic), because a longer tailored myotomy is possible',['Mild early disease, because it avoids any incision','End-stage sigmoid esophagus >6 cm','Only patients unfit for any procedure'],'Type III → POEM preferred (longer, tailored myotomy) [§1.1, p.2].'),
Q('What is the main drawback of POEM compared with Heller-Dor?','Higher risk of post-procedure reflux',['It cannot be used in type III','It needs an external abdominal incision','It has a 97% recurrence rate'],'POEM: higher risk of post-procedure reflux compared to Heller-Dor [§1.1, p.2].')
]),

sub('1.2','Esophageal Diverticula','pp.4–5',[
P('Pouch-like protrusions of the esophageal lining through weak areas of the wall, classified by location and mechanism of formation.'),
TB('The three types',['','Zenker','Mid-esophageal','Epiphrenic'],[
 ['Location','Hypopharynx, just above the UES','Middle third','Distal esophagus, just above the LES'],
 ['Mechanism','Pulsion – ↑ pressure on swallowing; herniation through Killian’s triangle (between cricopharyngeus and inferior pharyngeal constrictor)','Traction – external inflammation (tuberculosis, histoplasmosis) → fibrotic adherence','Pulsion – associated with achalasia, diffuse esophageal spasm, hypertensive LES'],
 ['True / false','False (mucosa + submucosa)','True (all layers)','False'],
 ['Symptoms','Dysphagia, regurgitation of undigested food, cough, halitosis, lump in throat','Often asymptomatic; dysphagia/chest pain if large','Dysphagia, regurgitation, chest pain, sometimes aspiration'],
 ['Diagnosis','Barium swallow; endoscopy to exclude other pathology','Barium swallow + CT','Barium swallow; manometry (motility disorder); endoscopy'],
 ['Treatment','Endoscopic stapling, cricopharyngeal myotomy, open excision','Observe if asymptomatic; resection if symptomatic/complicated','Diverticulectomy + myotomy of the LES']]),
TB('General approach',['Domain','Content'],[
 ['Symptoms','Dysphagia, regurgitation, chest pain, cough/aspiration, halitosis, weight loss in severe cases'],
 ['Diagnostics','Barium swallow (size, location), endoscopy (mucosa, biopsy, rule out malignancy), manometry (associated motility disorder)'],

addSh('1.1',[

 ['Chagas disease','Trypanosoma cruzi (South America) destroys myenteric neurons (inhibitory nNOS/VIP neurons and interstitial cells of Cajal); chagasic megaesophagus'],
 ['Allgrove (Triple A)','Achalasia + alacrima + adrenal insufficiency (often + autonomic dysfunction); autosomal recessive, AAAS gene (ALADIN); childhood onset; mineralocorticoids usually preserved'],
 ['Malignancy','Esophageal or gastric cancer (mass effect or paraneoplastic) – hence biopsy at endoscopy'],
 ['Others','Amyloidosis, neurofibromatosis type I, sarcoidosis, mediastinal lymphadenopathy']])),

SH(UL('Treatment – extra points',['Graded pneumatic dilation, laparoscopic Heller and POEM have comparable efficacy; LHM and POEM equal in types I and II','Before anesthesia, place a nasoesophageal tube and wash out the esophagus to avoid aspiration pneumonia','Pneumatic dilation: start with a 30 mm balloon (perforation risk); a second 35 mm dilation prolongs time to recurrence – different from peptic-stricture dilation (up to 20 mm, lower pressure)','Botulinum toxin: palliative, for patients unfit for more invasive treatment; repeat every 6–12 months; calcium-channel blockers only if nothing else','POEM: submucosal tunnel, muscle cut (not removed), mucosal opening clipped; issues: narrow field, pericardial injury, skilled endoscopist needed, takes hours, lifelong PPIs (no fundoplication possible)','Heller: reverse Trendelenburg, 4–5 ports, liver retractor, phrenoesophageal ligament divided, vagus nerves preserved, myotomy stopped when mucosa bulges (bougie may help); 4–6 cm on the esophagus + 2 cm on the stomach (6–8 cm in total); about 1 hour, 24–48 h observation'])),
SH(TB('Dor vs Toupet after Heller',['','Dor','Toupet'],[
 ['Wrap','180° anterior','270° posterior'],
 ['Advantage','Faster, less posterior dissection, covers the exposed mucosa; fundus sutured to both myotomy edges and to the crus','Holds the myotomy edges widely apart so the muscle cannot scar back'],
 ['Choice','Both are standard of care; usually surgeon preference and training','']])),
SH(NOTE('Why not a Nissen (360°) after Heller? In GERD, normal peristalsis can push food through a tight wrap. In achalasia the esophagus is aperistaltic and gravity-dependent, so a 360° wrap would cause severe, immediate, intractable dysphagia. Partial wraps (Dor 180°, Toupet 270°) give low resistance.')),
DISC('Dysphagia order: the summary says solids first, later liquids; Shunit says it starts with liquids (paradoxical dysphagia) and contrasts it with cancer, where solids come first. Heller length: summary about 10 cm (4–5 cm above the diaphragm, 2–3 cm onto the stomach); slides 5 cm above and 2 cm onto the stomach; Shunit 4–6 cm above and 2 cm onto the stomach. Epidemiology: slides 1 in 100,000 per year and prevalence 20 in 100,000; Shunit 1.07–2.2 and 10–15.7.')
],[

Q('Which Chicago type is best treated with POEM?','Type III, because a long myotomy is needed',['Type I','Type II','None – all need Heller'],'[Shunit notes: POEM].'),
Q('Achalasia + alacrima + adrenal insufficiency describes:','Allgrove (Triple A) syndrome',['Chagas disease','Plummer-Vinson syndrome','Howel-Evans syndrome'],'Autosomal recessive, AAAS gene [Shunit notes: Achalasia, pseudoachalasia].'),

 ['Evidence','About 1,600 patients (BIO-A, Phasix vs primary cruroplasty): absorbable mesh reduces short-to-medium-term recurrence']])),

],[

Q('Which mesh should be used at hiatoplasty?','Absorbable synthetic mesh (e.g. BIO-A)',['Permanent polypropylene','No mesh ever','Any mesh'],'Permanent mesh can migrate and perforate [Shunit notes: choice of mesh].'),

function editorToMarkup(root){
  let out='';
  const wrap=(t,st)=>{let s=t;if(st.h)s='=='+s+'==';if(st.u)s='__'+s+'__';if(st.b)s='**'+s+'**';return s;};
  function walk(n,st){
    if(n.nodeType===3){const t=n.nodeValue.replace(/\u00a0/g,' ');if(t)out+=wrap(t,st);return;}
    if(n.nodeType!==1)return;
    const tag=n.nodeName;
    if(tag==='BR'){out+='\n';return;}
    const s={b:st.b,u:st.u,h:st.h};
    const fw=n.style&&n.style.fontWeight;
    if(tag==='B'||tag==='STRONG'||fw==='bold'||(fw&&+fw>=600))s.b=true;
    const td=n.style&&(n.style.textDecorationLine||n.style.textDecoration)||'';
    if(tag==='U'||/underline/.test(td))s.u=true;
    const bg=n.style&&n.style.backgroundColor;
    if(bg){if(bg==='transparent'||/rgba\(0,\s*0,\s*0,\s*0\)/.test(bg))s.h=false;else s.h=true;}
    if(tag==='MARK')s.h=true;
    const block=/^(DIV|P|LI)$/.test(tag);
    if(block&&out&&!/\n$/.test(out))out+='\n';
    n.childNodes.forEach(c=>walk(c,s));
  }
  root.childNodes.forEach(c=>walk(c,{b:false,u:false,h:false}));
  out=out.replace(/\*\*\*\*/g,'').replace(/____/g,'').replace(/====/g,'');
  return out.replace(/[ \t]+\n/g,'\n').replace(/\n{3,}/g,'\n\n').replace(/^\n+|\s+$/g,'');
}

let lastRange=null,lastEd=null;

function edRange(ed){
  const s=window.getSelection();
  if(s&&s.rangeCount){const r=s.getRangeAt(0);if(ed.contains(r.commonAncestorContainer))return r.cloneRange();}
  if(lastRange&&lastEd===ed&&ed.contains(lastRange.commonAncestorContainer))return lastRange.cloneRange();

function segmentsIn(ed,range){
  const sc=range.startContainer,so=range.startOffset,ec=range.endContainer,eo=range.endOffset;
  const nodes=[];const tw=document.createTreeWalker(ed,NodeFilter.SHOW_TEXT);let n;
  while((n=tw.nextNode())){if(range.intersectsNode(n))nodes.push(n);}
  const segs=[];
  nodes.forEach(t=>{
    let st=0,en=t.nodeValue.length;
    if(t===sc)st=so;
    if(t===ec)en=eo;
    if(st>=en)return;
    let node=t;
    if(en<node.nodeValue.length)node.splitText(en);
    if(st>0)node=node.splitText(st);
    segs.push(node);
  });

}
function markSeg(seg){if(seg.parentElement&&seg.parentElement.closest('mark'))return;const m=document.createElement('mark');seg.parentNode.insertBefore(m,seg);m.appendChild(seg);}
function unmarkSegs(ed,segs){
  const set=new Set(segs),marks=new Set();
  segs.forEach(s=>{const m=s.parentElement&&s.parentElement.closest('mark');if(m&&ed.contains(m))marks.add(m);});
  marks.forEach(m=>{
    const leaves=[];const tw=document.createTreeWalker(m,NodeFilter.SHOW_TEXT);let n;while((n=tw.nextNode()))leaves.push(n);
    const p=m.parentNode;while(m.firstChild)p.insertBefore(m.firstChild,m);p.removeChild(m);
    leaves.forEach(l=>{if(!set.has(l))markSeg(l);});
  });

      const segs=segmentsIn(ed,r0);

      const on=segs.every(s=>s.parentElement&&s.parentElement.closest('mark'));

  h+='<div class="card"><div class="row"><label class="inline">Exam date <input type="date" id="examDate" value="'+esc(S.examDate)+'"></label><label class="inline">or days left <input type="number" id="daysIn" min="0" max="365" value="'+Math.max(0,dl)+'" style="width:5.5em"></label></div>';
  h+='<p class="muted" style="margin:.6em 0 0">'+(dl>0?('Exam on <b>'+esc(dfmt(ed))+'</b> · '+dl+' study day'+(dl>1?'s':'')+' from today, today included.'):'Exam day is here or past – all open topics are in one final review block.')+' The plan is rebuilt from today every time you tick a topic or change the date.</p>';
  h+='<div class="row" style="margin-top:10px"><label class="inline"><input type="checkbox" id="incExtra" '+(S.includeExtras?'checked':'')+'> Include extra topics (in the summaries, not on the syllabus)</label></div>';
  h+='<div class="row" style="margin-top:10px"><div class="prog grow"><i style="width:'+Math.round(100*done.length/(all.length||1))+'%"></i></div><span class="muted">'+done.length+' / '+all.length+' covered</span></div></div>';
  if(!rem.length)h+='<div class="card"><b>Every topic is ticked.</b> Use Oral practice to rehearse, or untick a topic to bring it back into the plan.</div>';
  buckets.forEach((b,i)=>{
    const d=addDays(today(),i);
    const label=dl<=0?'Final review':('Day '+(i+1)+(i===0?' · Today':''));
    h+='<section class="card day"><h3>'+label+(dl>0?'<small>'+esc(dfmt(d))+'</small>':'')+'</h3>';
    if(!b.length)h+='<p class="muted" style="margin:0">Nothing scheduled – a free day. Try the flashcards in Oral practice.</p>';
    b.forEach(t=>{h+=topicRow(t,false);});
    h+='</section>';
  });
  if(done.length){h+='<h3>Covered</h3><section class="card">';done.forEach(t=>{h+=topicRow(t,true);});h+='</section>';}
  h+='<p class="muted" style="font-size:.85rem">Syllabus order is kept. Topics are balanced by amount of material, not by count.</p></div>';
  return h;
}
function topicRow(t,isDone){
  return '<div class="topic'+(isDone?' done':'')+'"><input type="checkbox" data-a="tick" data-id="'+t.id+'" '+(isDone?'checked':'')+' aria-label="Mark '+esc(t.t)+' as covered"><div class="grow"><div class="tt">'+esc(t.t)+'</div><div class="row" style="gap:6px;margin-top:3px">'+readyBadge(t)+(t.extra?'<span class="badge">Extra</span>':'')+'<span class="muted" style="font-size:.8rem">Summaries §'+t.subs.join(', §')+'</span></div>'+(t.n?'<div class="note">'+esc(t.n)+'</div>':'')+'</div><button class="btn small" data-a="openTopic" data-id="'+t.id+'">Read</button></div>';
}

/* ===== READ ===== */
function scoreBadge(k){const s=S.scores[k];return s?'<span class="badge acc">best '+s.best+'/'+s.total+'</span>':'';}
function vRead(){
  const R=U.read;
  if(U.quiz)return vQuiz();
  if(R.mode==='list')return vChapters();
  if(R.mode==='oral')return vChOral();
  return vSub();
}
function vChapters(){
  let h='<div class="wrap"><h2>Read &amp; quiz</h2><p class="muted">Chapters and subchapters follow your summaries exactly. Each subchapter: reading, then a short MCQ check.</p>';
  CHAPTERS.forEach(c=>{
    const nq=c.subs.reduce((a,s)=>a+s.mcqs.length,0);
    h+='<div class="ch"><h2>'+esc(c.title)+'</h2>';
    c.subs.forEach(s=>{h+='<button class="subrow" data-a="openSub" data-id="'+s.id+'"><span class="n">'+s.id+'</span><span class="t grow">'+esc(s.title)+'</span><span class="muted" style="font-size:.8rem">'+esc(s.pages)+(s.slides||s.shunit?' + slides/notes':'')+' · '+s.mcqs.length+' Q</span>'+scoreBadge('sub:'+s.id)+'</button>';});
    h+='<div class="row" style="margin-top:10px"><button class="btn primary" data-a="chReview" data-id="'+c.id+'">Chapter review · '+nq+' Q shuffled</button><button class="btn" data-a="chOral" data-id="'+c.id+'">Oral-style prompt</button>'+scoreBadge('rev:'+c.id)+'</div></div>';
  });
  return h+'</div>';
}
function blockHtml(b){
  const tag=b.sl?'<span class="sltag">Slides</span> ':b.sh?'<span class="shtag">Shunit</span> ':'';
  if(b.t==='p')return '<p>'+tag+fmt(b.x)+'</p>';
  if(b.t==='note')return '<div class="callout">'+tag+fmt(b.x)+'</div>';
  if(b.t==='disc')return '<div class="callout disc"><b>Sources differ:</b> '+fmt(b.x)+'</div>';
  if(b.t==='ul')return '<h4>'+tag+esc(b.h)+'</h4><ul>'+b.items.map(i=>'<li>'+fmt(i)+'</li>').join('')+'</ul>';
  if(b.t==='fl')return '<h4>'+tag+esc(b.h)+'</h4><ol class="flow">'+b.steps.map(i=>'<li>'+fmt(i)+'</li>').join('')+'</ol>';
  if(b.t==='tb')return '<h4>'+tag+esc(b.h)+'</h4><div class="tw"><table><thead><tr>'+b.cols.map(c=>'<th>'+esc(c)+'</th>').join('')+'</tr></thead><tbody>'+b.rows.map(r=>'<tr>'+r.map(c=>'<td>'+fmt(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';
  return '';
}
function vSub(){
  const f=findSub(U.read.sub);if(!f){U.read.mode='list';return vChapters();}
  const {c,s}=f;
  let h='<div class="wrap"><div class="crumbs"><button data-a="toList">← All chapters</button> · '+esc(c.title)+'</div><h2>'+s.id+' '+esc(s.title)+'</h2><p class="muted">Source: your summaries, '+esc(s.pages)+((s.slides?' · <span class="sltag">Slides</span> = Prof. Peri’s lecture decks':'')+(s.shunit?' · <span class="shtag">Shunit</span> = your friend’s notes':''))+'</p>';
  h+='<div class="reading">'+s.blocks.map(blockHtml).join('')+'</div>';
  h+='<div class="card row" style="margin-top:22px"><div class="grow"><b>Check yourself</b><div class="muted">'+s.mcqs.length+' questions · one correct answer each '+scoreBadge('sub:'+s.id)+'</div></div><button class="btn primary" data-a="startSub" data-id="'+s.id+'">Start quiz</button></div>';
  const idx=c.subs.findIndex(x=>x.id===s.id);
  h+='<div class="row" style="justify-content:space-between;margin-top:8px">'+(idx>0?'<button class="btn small" data-a="openSub" data-id="'+c.subs[idx-1].id+'">← '+c.subs[idx-1].id+'</button>':'<span></span>')+(idx<c.subs.length-1?'<button class="btn small" data-a="openSub" data-id="'+c.subs[idx+1].id+'">'+c.subs[idx+1].id+' →</button>':'<span></span>')+'</div></div>';
  return h;
}
function vChOral(){
  const c=CHAPTERS.find(x=>x.id===U.read.ch);const o=CH_ORAL[c.id];const rev=U.read.oral;
  let h='<div class="wrap"><div class="crumbs"><button data-a="toList">← All chapters</button> · '+esc(c.title)+'</div><h2>Oral-style prompt</h2><div class="card"><div class="q">'+esc(o.q)+'</div>';
  if(rev){h+='<div class="ans">'+paras(o.a)+'</div><div class="src"><b>Source:</b> '+esc(o.s)+'</div>';}
  else h+='<div style="margin-top:10px"><button class="btn primary" data-a="revealCh">Reveal model answer</button></div>';
  return h+'</div></div>';
}

/* ===== QUIZ ===== */
function withH(s){return s.mcqs.map(m=>Object.assign({h:s.id+' '+s.title},m));}
function startQuiz(key,title,mcqs,back){
  const items=mcqs.map(m=>{const opts=shuffle(m.opts.map((o,i)=>({o,ok:i===0})));return {q:m.q,opts,e:m.e,h:m.h||''};});
  U.quiz={key,title,items,i:0,picked:new Array(items.length).fill(-1),score:0,back};
  render();window.scrollTo(0,0);
}
function vQuiz(){
  const z=U.quiz;const n=z.items.length;
  let h='<div class="wrap"><div class="crumbs"><button data-a="quitQuiz">← Leave quiz</button> · '+esc(z.title)+'</div>';
  if(z.i>=n){
    const s=S.scores[z.key]||{};
    h+='<div class="card"><h2>Set complete</h2><div class="score">'+z.score+' / '+n+'</div><div class="prog"><i style="width:'+Math.round(100*z.score/n)+'%"></i></div><p class="muted">Best on this device: '+(s.best!=null?s.best+' / '+s.total:'–')+'</p>';
    const missed=z.items.map((it,i)=>({it,i})).filter(x=>{const p=z.picked[x.i];return p<0||!x.it.opts[p].ok;});
    if(missed.length){h+='<h3>To review</h3>';missed.forEach(x=>{h+='<div class="expl"><b>'+esc(x.it.q)+'</b><br>Correct: '+esc(x.it.opts.find(o=>o.ok).o)+'<br>'+esc(x.it.e)+'</div><div style="height:8px"></div>';});}
    h+='<div class="row" style="margin-top:14px"><button class="btn primary" data-a="retryQuiz">Try again</button><button class="btn" data-a="quitQuiz">Back</button></div></div></div>';
    return h;
  }
  const it=z.items[z.i];const p=z.picked[z.i];const answered=p>=0;
  h+='<div class="row muted" style="justify-content:space-between"><span>Question '+(z.i+1)+' of '+n+'</span><span>Score '+z.score+'</span></div><div class="prog" style="margin-top:6px"><i style="width:'+Math.round(100*z.i/n)+'%"></i></div>';
  h+=(it.h?'<div class="qhead">'+esc(it.h)+'</div>':'')+'<div class="qtext">'+esc(it.q)+'</div><div class="opts">';
  it.opts.forEach((o,i)=>{let cls='opt';if(answered){if(o.ok)cls+=' ok';else if(i===p)cls+=' bad';}
    h+='<button class="'+cls+'" data-a="pick" data-i="'+i+'" '+(answered?'disabled':'')+'><span class="l">'+'ABCD'[i]+'</span><span>'+esc(o.o)+'</span></button>';});
  h+='</div>';
  if(answered){h+='<div class="expl"><b>'+(it.opts[p].ok?'Correct.':'Not quite.')+'</b> '+(it.opts[p].ok?'':'Correct answer: '+esc(it.opts.find(o=>o.ok).o)+'. ')+esc(it.e)+'</div><div style="margin-top:12px"><button class="btn primary" data-a="nextQ">'+(z.i===n-1?'See score':'Next')+' →</button></div>';}
  return h+'</div>';
}
function finishScore(){const z=U.quiz;const n=z.items.length;const o=S.scores[z.key]||{best:0,total:n};S.scores[z.key]={best:Math.max(o.best||0,z.score),total:n,last:z.score};save();}

/* ===== ORAL ===== */
function vOral(){
  const O=U.oral;
  let h='<div class="wrap"><h2>Oral practice</h2><div class="row" style="margin-bottom:8px"><button class="btn'+(O.sub==='bank'?' primary':'')+'" data-a="oralSub" data-v="bank">Question bank</button><button class="btn'+(O.sub==='cards'?' primary':'')+'" data-a="oralSub" data-v="cards">Flashcards</button></div>';
  if(O.sub==='bank'){
    const nd=S.qs.filter(q=>q.diff).length;
    h+='<div class="card"><div class="row"><input type="search" id="bankSearch" placeholder="Search questions" aria-label="Search questions" value="'+esc(O.q)+'" class="grow"><select id="bankTopic" aria-label="Filter by topic"><option value="">All topics</option>'+topicList().map(t=>'<option value="'+esc(t)+'"'+(O.topic===t?' selected':'')+'>'+esc(t)+'</option>').join('')+'</select><label class="inline"><input type="checkbox" id="bankDiff" '+(O.diff?'checked':'')+'> Difficult only ('+nd+')</label><button class="btn primary" data-a="addQ">+ Add question</button></div><div class="muted" id="bankCount" style="margin-top:6px"></div></div>';
    if(O.adding)h+=editForm({id:'',q:'',a:'',s:'',gap:''},true);
    h+='<div id="bankList"></div>';
  }else h+=vCards();
  return h+'</div>';
}
function topicList(){const seen=[];S.qs.forEach(q=>{const t=q.t||'My questions';if(seen.indexOf(t)<0)seen.push(t);});
  const known=TOPIC_ORDER.filter(t=>seen.indexOf(t)>=0);const other=seen.filter(t=>TOPIC_ORDER.indexOf(t)<0&&t!=='My questions');
  return known.concat(other,seen.indexOf('My questions')>=0?['My questions']:[]);}
function gapHtml(q){return q.gap?'<div class="gap '+(q.gl||'')+'"><b>'+(q.gl==='none'?'Not covered':q.gl==='conflict'?'Discrepancy':'Gap')+':</b> '+rich(q.gap)+'</div>':'';}
function answerHtml(q){
  if(!q.a.trim())return '<div class="ans muted">No model answer – the materials do not cover this question.</div>'+gapHtml(q);
  return '<div class="ans">'+paras(q.a)+'</div>'+(q.s?'<div class="src"><b>Source:</b> '+rich(q.s)+'</div>':'')+gapHtml(q);
}
function editForm(q,isNew){
  return '<div class="card" id="editBox">'+rteBox('eq','Question',q.q,3)+'<div class="field"><span>Topic</span><input type="text" id="et" list="topicDl" style="width:100%" value="'+esc(q.t||'')+'"><datalist id="topicDl">'+topicList().map(t=>'<option value="'+esc(t)+'">').join('')+'</datalist></div>'+rteBox('ea','Model answer (leave empty if the materials do not cover it)',q.a,7)+'<div class="field"><span>Source</span><input type="text" id="es" style="width:100%" value="'+esc(q.s)+'"></div><div class="field"><span>Gap / discrepancy note (optional)</span><textarea id="eg" rows="2">'+esc(q.gap||'')+'</textarea></div><p class="muted" style="font-size:.82rem;margin:.2em 0 .8em">Select text, then use <b>B</b>, <u>U</u> or the highlighter. Shortcuts: Ctrl+B and Ctrl+U.</p><div class="row"><button class="btn primary" data-a="'+(isNew?'saveNew':'saveEdit')+'" data-id="'+esc(q.id)+'">Save</button><button class="btn" data-a="cancelEdit">Cancel</button></div></div>';
}
function bankItem(q,n){
  const O=U.oral;
  if(O.edit===q.id)return editForm(q,false);
  const open=!!O.revealed[q.id];
  return '<div class="card"><div class="row" style="align-items:flex-start"><div class="grow"><div class="row" style="gap:6px;margin-bottom:4px"><span class="badge">#'+n+'</span><span class="muted" style="font-size:.78rem">'+esc(q.g||(q.custom?'My question':''))+(q.tg?' · also: '+esc(q.tg):'')+'</span>'+(q.gl?'<span class="badge '+(q.gl==='partial'?'warn':'bad')+'">'+(q.gl==='partial'?'Partly covered':q.gl==='none'?'Not covered':'Discrepancy')+'</span>':'')+(!q.a.trim()&&q.gl!=='none'?'<span class="badge bad">No answer</span>':'')+'</div><div class="q">'+rich(q.q)+'</div></div><button class="star" data-a="toggleDiff" data-id="'+esc(q.id)+'" aria-pressed="'+q.diff+'" aria-label="Difficult" title="Difficult">'+(q.diff?'★':'☆')+'</button></div>'
  +'<div class="row" style="margin-top:8px"><button class="btn small" data-a="toggleAns" data-id="'+esc(q.id)+'">'+(open?'Hide answer':'Show answer')+'</button><button class="btn small" data-a="editQ" data-id="'+esc(q.id)+'">Edit</button>'+(O.del===q.id?'<span class="muted">Delete this question?</span><button class="btn small danger" data-a="delYes" data-id="'+esc(q.id)+'">Yes, delete</button><button class="btn small" data-a="delNo">No</button>':'<button class="btn small danger" data-a="delQ" data-id="'+esc(q.id)+'">Delete</button>')+'</div>'+(open?answerHtml(q):'')+'</div>';
}
function renderBank(){
  const O=U.oral;const el=$('#bankList');if(!el)return;
  const term=O.q.trim().toLowerCase();
  let list=S.qs.map((q,i)=>({q,n:i+1}));
  if(O.diff)list=list.filter(x=>x.q.diff);
  if(O.topic)list=list.filter(x=>(x.q.t||'My questions')===O.topic);
  if(term)list=list.filter(x=>(x.q.q+' '+x.q.a+' '+x.q.g+' '+(x.q.t||'')+' '+(x.q.tg||'')).toLowerCase().indexOf(term)>=0);
  let h='';
  topicList().forEach(t=>{
    const g=list.filter(x=>(x.q.t||'My questions')===t);if(!g.length)return;
    h+='<h3 class="topichead">'+esc(t)+' <span class="muted" style="font-size:.8rem;font-weight:400">· '+g.length+'</span></h3>'+g.map(x=>bankItem(x.q,x.n)).join('');
  });
  el.innerHTML=h||'<div class="card muted">No questions to show.</div>';
  const c=$('#bankCount');if(c)c.textContent=list.length+' of '+S.qs.length+' questions'+(S.qs.filter(q=>!q.a.trim()).length?' · '+S.qs.filter(q=>!q.a.trim()).length+' without a model answer':'');
}
/* flashcards */
function buildDeck(){
  const F=U.fc;let pool=S.qs.slice();if(F.only)pool=pool.filter(q=>q.diff);
  pool=shuffle(pool);
  if(F.first&&!F.only)pool=pool.filter(q=>q.diff).concat(pool.filter(q=>!q.diff));
  F.deck=pool.map(q=>q.id);F.i=0;F.rev={};F.seen={};F.edit=false;
}
function vCards(){
  const F=U.fc;
  if(!F.deck){
    const nd=S.qs.filter(q=>q.diff).length;
    return '<div class="card"><p style="margin-top:0">Cards come in random order. '+S.qs.length+' cards, '+nd+' marked difficult.</p><div class="row" style="flex-direction:column;align-items:flex-start;gap:8px"><label class="inline"><input type="checkbox" id="fcFirst" '+(F.first?'checked':'')+'> Difficult first (shuffle the tagged cards, then the rest)</label><label class="inline"><input type="checkbox" id="fcOnly" '+(F.only?'checked':'')+'> Only difficult</label></div><div style="margin-top:12px"><button class="btn primary" data-a="startDeck">Start deck</button></div></div>';
  }
  const deck=F.deck.map(id=>S.qs.find(q=>q.id===id)).filter(Boolean);
  if(!deck.length)return '<div class="card">No cards in this deck. '+(F.only?'Tag some questions as difficult first.':'')+'<div style="margin-top:10px"><button class="btn" data-a="deckSetup">Back to options</button></div></div>';
  if(F.i>=deck.length){
    const revN=Object.keys(F.rev).length;const dq=deck.filter(q=>q.diff);
    let h='<div class="card"><h2 style="margin-top:0">Deck finished</h2><p>'+deck.length+' cards · '+revN+' answers revealed · '+dq.length+' tagged difficult.</p>';
    if(dq.length){h+='<h3>Difficult in this deck</h3><ul>'+dq.map(q=>'<li>'+esc(q.q.length>140?q.q.slice(0,140)+'…':q.q)+'</li>').join('')+'</ul>';}
    return h+'<div class="row" style="margin-top:12px"><button class="btn primary" data-a="startDeck">Reshuffle</button><button class="btn" data-a="deckSetup">Change options</button></div></div>';
  }
  const q=deck[F.i];const rev=!!F.rev[q.id];
  let h='<div class="row muted" style="justify-content:space-between"><span>Card '+(F.i+1)+' of '+deck.length+'</span><button class="btn small" data-a="deckSetup">Options</button></div><div class="prog" style="margin:6px 0 10px"><i style="width:'+Math.round(100*F.i/deck.length)+'%"></i></div>';
  if(F.edit)return h+editForm(q,false);
  h+='<div class="card fc"><div class="row" style="align-items:flex-start"><div class="grow"><div class="row" style="gap:6px;margin-bottom:4px"><span class="badge acc">'+esc(q.t||'My questions')+'</span><span class="muted" style="font-size:.78rem">'+esc(q.g)+(q.tg?' · also: '+esc(q.tg):'')+'</span></div><div class="q">'+rich(q.q)+'</div></div><button class="star" data-a="toggleDiff" data-id="'+esc(q.id)+'" aria-pressed="'+q.diff+'" aria-label="Difficult" title="Difficult (d)">'+(q.diff?'★':'☆')+'</button></div>';
  h+=rev?answerHtml(q):'<div style="margin-top:14px"><button class="btn primary" data-a="revealCard">Reveal answer</button></div>';
  h+='<div class="row" style="margin-top:auto;padding-top:14px"><button class="btn" data-a="prevCard" '+(F.i===0?'disabled':'')+'>← Prev</button><button class="btn small" data-a="editCard">Edit</button><span class="grow"></span><button class="btn primary" data-a="nextCard">'+(F.i===deck.length-1?'Finish':'Next')+' →</button></div></div>';
  return h;
}

/* ===== export / import ===== */
function exportJSON(){return JSON.stringify({app:'gi-surgery-study-hub',version:1,exportedAt:new Date().toISOString(),data:S},null,2);}
async function doExport(){
  const json=exportJSON();
  const fname='gi-hub-export-'+dstr(new Date())+'.json';
  try{
    if(window.claude&&window.claude.use){
      const dl=await window.claude.use('downloads');
      if(dl){await dl.save({filename:fname,data:json});toast('Export ready');return;}
    }
  }catch(e){if(e&&e.code==='declined'){return;}}
  modal('<h3 style="margin-top:0">Export</h3><p class="muted">Download the file, or copy the text and keep it somewhere safe (notes app, email to yourself). Import it later to restore everything.</p><div class="row" style="margin-bottom:8px"><button class="btn primary" data-a="dlExp">Download file</button><button class="btn" data-a="copyExp">Copy text</button><button class="btn" data-a="closeModal">Close</button></div><textarea id="expTxt" readonly>'+esc(json)+'</textarea>');
  window.__exp={json,fname};
}
function blobDownload(){
  try{const x=window.__exp;const u=URL.createObjectURL(new Blob([x.json],{type:'application/json'}));const l=document.createElement('a');l.href=u;l.download=x.fname;document.body.appendChild(l);l.click();setTimeout(()=>{URL.revokeObjectURL(u);l.remove();},1500);toast('Download started');}
  catch(e){toast('Download blocked – use Copy text instead.');}
}
function doImportModal(){
  modal('<h3 style="margin-top:0">Import</h3><p class="muted">Load a file you exported earlier. This replaces the current data on this device.</p><input type="file" id="impFile" accept=".json,application/json"><p class="muted" style="margin:10px 0 4px">or paste the text:</p><textarea id="impTxt" placeholder="Paste exported JSON here"></textarea><div class="row" style="margin-top:10px"><button class="btn primary" data-a="runImport">Import</button><button class="btn" data-a="closeModal">Cancel</button></div>');
}
function applyImport(text){
  try{
    const p=JSON.parse(text);const d=p&&p.data&&typeof p.data==='object'?p.data:p;
    if(!d||typeof d!=='object'||!Array.isArray(d.qs))throw new Error('bad');
    S=Object.assign(defaults(),d);fix();reconcile();save();applyTheme();closeModal();U.oral.edit=null;U.fc.deck=null;render();toast('Imported '+S.qs.length+' questions');
  }catch(e){toast('That file could not be read as a hub export.');}
}
function modal(html){closeModal();const d=document.createElement('div');d.className='overlay';d.id='ov';d.innerHTML='<div class="modal" role="dialog" aria-modal="true">'+html+'</div>';document.body.appendChild(d);const f=d.querySelector('textarea,input');if(f)f.focus();}
function closeModal(){const o=$('#ov');if(o)o.remove();}

/* ===== events ===== */
function readFields(){return {t:$('#et').value.trim(),q:editorToMarkup($('#eq')),a:editorToMarkup($('#ea')),s:$('#es').value.trim(),gap:$('#eg').value.trim()};}
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a,id=b.dataset.id;
  switch(a){
  case 'tab':go(b.dataset.tab);break;
  case 'fmt':{const ed=b.closest('.rtw').querySelector('.rte');fmtCmd(ed,b.dataset.cmd);break;}
  case 'tick':{if(b.checked)S.done[id]=true;else delete S.done[id];save();render();break;}
  case 'openTopic':{const t=TOPICS.find(x=>x.id===id);U.quiz=null;U.read={ch:null,sub:t.subs[0],mode:'sub',oral:null};go('read');break;}
  case 'openSub':U.quiz=null;U.read={ch:null,sub:id,mode:'sub',oral:null};render();window.scrollTo(0,0);break;
  case 'toList':U.read={ch:null,sub:null,mode:'list',oral:null};render();window.scrollTo(0,0);break;
  case 'startSub':{const f=findSub(id);startQuiz('sub:'+id,id+' '+f.s.title,withH(f.s),{mode:'sub',sub:id});break;}
  case 'chReview':{const c=CHAPTERS.find(x=>x.id===id);const all=[];c.subs.forEach(s=>withH(s).forEach(m=>all.push(m)));startQuiz('rev:'+id,'Chapter review – '+c.title,shuffle(all),{mode:'list'});break;}
  case 'chOral':U.read={ch:id,sub:null,mode:'oral',oral:false};render();window.scrollTo(0,0);break;
  case 'revealCh':U.read.oral=true;render();break;
  case 'pick':{const z=U.quiz;if(z.picked[z.i]>=0)break;const i=+b.dataset.i;z.picked[z.i]=i;if(z.items[z.i].opts[i].ok)z.score++;render();break;}
  case 'nextQ':{const z=U.quiz;z.i++;if(z.i>=z.items.length)finishScore();render();window.scrollTo(0,0);break;}
  case 'retryQuiz':{const z=U.quiz;const f=z.key.startsWith('sub:')?findSub(z.key.slice(4)):null;let m;if(f)m=withH(f.s);else{const c=CHAPTERS.find(x=>x.id===z.key.slice(4));m=[];c.subs.forEach(s=>withH(s).forEach(x=>m.push(x)));m=shuffle(m);}startQuiz(z.key,z.title,m,z.back);break;}
  case 'quitQuiz':{const bk=U.quiz.back||{mode:'list'};U.quiz=null;U.read=Object.assign({ch:null,sub:null,oral:null},bk);render();window.scrollTo(0,0);break;}
  case 'oralSub':U.oral.sub=b.dataset.v;U.oral.edit=null;U.oral.adding=false;render();break;
  case 'addQ':U.oral.adding=true;U.oral.edit=null;render();{const t=$('#eq');if(t)t.focus();}break;
  case 'saveNew':{const f=readFields();if(!f.q){toast('Write the question first.');break;}S.qs.push({id:'c'+Date.now().toString(36),q:f.q,a:f.a,s:f.s,g:'',t:f.t||'My questions',tg:'',gap:f.gap,gl:'',diff:false,custom:true});save();U.oral.adding=false;render();toast('Question added');break;}
  case 'editQ':U.oral.edit=id;U.oral.adding=false;U.oral.del=null;renderBank();{const t=$('#eq');if(t)t.focus();}break;
  case 'saveEdit':{const f=readFields();if(!f.q){toast('The question cannot be empty.');break;}const q=S.qs.find(x=>x.id===id);if(q){q.t=f.t||q.t||'My questions';q.q=f.q;q.a=f.a;q.s=f.s;q.gap=f.gap;if(!f.gap)q.gl='';}save();U.oral.edit=null;U.fc.edit=false;render();toast('Saved');break;}
  case 'cancelEdit':U.oral.edit=null;U.oral.adding=false;U.fc.edit=false;render();break;
  case 'delQ':U.oral.del=id;renderBank();break;
  case 'delNo':U.oral.del=null;renderBank();break;
  case 'delYes':{S.qs=S.qs.filter(x=>x.id!==id);if(S.deleted.indexOf(id)<0)S.deleted.push(id);save();U.oral.del=null;renderBank();const c=$('#bankCount');break;}
  case 'toggleAns':U.oral.revealed[id]=!U.oral.revealed[id];renderBank();break;
  case 'toggleDiff':{const q=S.qs.find(x=>x.id===id);if(q){q.diff=!q.diff;save();if(U.tab==='oral'&&U.oral.sub==='cards')render();else{render();}}break;}
  case 'startDeck':buildDeck();render();break;
  case 'deckSetup':U.fc.deck=null;render();break;
  case 'revealCard':{const q=S.qs.find(x=>x.id===U.fc.deck[U.fc.i]);if(q)U.fc.rev[q.id]=true;render();break;}
  case 'nextCard':U.fc.i++;render();break;
  case 'prevCard':if(U.fc.i>0)U.fc.i--;render();break;
  case 'editCard':U.fc.edit=true;render();break;
  case 'theme':S.theme=S.theme==='auto'?'light':S.theme==='light'?'dark':'auto';applyTheme();save();b.textContent=themeLbl();toast('Theme: '+S.theme);break;
  case 'export':doExport();break;
  case 'install':doInstall();break;
  case 'import':doImportModal();break;
  case 'runImport':{const f=$('#impFile').files[0];const t=$('#impTxt').value.trim();if(f){const r=new FileReader();r.onload=()=>applyImport(String(r.result));r.onerror=()=>toast('Could not read the file.');r.readAsText(f);}else if(t)applyImport(t);else toast('Choose a file or paste the text.');break;}
  case 'dlExp':blobDownload();break;
  case 'copyExp':{const t=$('#expTxt');t.select();try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t.value).then(()=>toast('Copied'),()=>{document.execCommand('copy');toast('Copied');});}else{document.execCommand('copy');toast('Copied');}}catch(er){toast('Select the text and copy it manually.');}break;}
  case 'closeModal':closeModal();break;
  }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='examDate'){if(parseD(t.value)){S.examDate=t.value;save();render();}}
  else if(t.id==='daysIn'){const n=Math.max(0,Math.min(365,parseInt(t.value,10)||0));S.examDate=dstr(addDays(today(),n));save();render();}
  else if(t.id==='incExtra'){S.includeExtras=t.checked;save();render();}
  else if(t.id==='bankTopic'){U.oral.topic=t.value;renderBank();}
  else if(t.id==='bankDiff'){U.oral.diff=t.checked;renderBank();}
  else if(t.id==='fcFirst'){U.fc.first=t.checked;}
  else if(t.id==='fcOnly'){U.fc.only=t.checked;}
});
document.addEventListener('input',e=>{if(e.target.id==='bankSearch'){U.oral.q=e.target.value;renderBank();}});
document.addEventListener('mousedown',e=>{if(e.target.closest('.rtb button'))e.preventDefault();});
document.addEventListener('paste',e=>{const ed=e.target.closest&&e.target.closest('.rte');if(!ed)return;e.preventDefault();const t=(e.clipboardData||window.clipboardData).getData('text/plain');document.execCommand('insertText',false,t);});
document.addEventListener('keydown',e=>{
  if(e.target.isContentEditable){if(e.key==='Enter'&&!e.shiftKey&&!e.ctrlKey&&!e.metaKey){e.preventDefault();document.execCommand('insertLineBreak');}if(e.key==='Escape')e.target.blur();return;}
  const tg=e.target.tagName;if(tg==='TEXTAREA'||tg==='INPUT'||tg==='SELECT')return;
  if(e.key==='Escape'){closeModal();return;}
  if(U.tab==='read'&&U.quiz&&U.quiz.i<U.quiz.items.length){
    const z=U.quiz;
    if(z.picked[z.i]<0&&'1234'.indexOf(e.key)>=0&&e.key){const i=+e.key-1;if(i<4){z.picked[z.i]=i;if(z.items[z.i].opts[i].ok)z.score++;render();}}
    else if(z.picked[z.i]>=0&&(e.key==='Enter'||e.key==='ArrowRight')){z.i++;if(z.i>=z.items.length)finishScore();render();}
  }else if(U.tab==='oral'&&U.oral.sub==='cards'&&U.fc.deck&&!U.fc.edit){
    const F=U.fc;const id=F.deck[F.i];
    if(e.key===' '||e.key==='Enter'){if(id&&!F.rev[id]){F.rev[id]=true;render();e.preventDefault();}}
    else if(e.key==='ArrowRight'){F.i++;render();}
    else if(e.key==='ArrowLeft'&&F.i>0){F.i--;render();}
    else if(e.key==='d'&&id){const q=S.qs.find(x=>x.id===id);if(q){q.diff=!q.diff;save();render();}}
  }
});
/* ===== install as app (PWA build only) ===== */
let deferredPrompt=null;
const isStandalone=()=>{try{return window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;}catch(e){return false;}};
const isPwaBuild=()=>!!document.querySelector('link[rel=manifest]');
function syncInstallBtn(){const b=document.getElementById('installBtn');if(b)b.hidden=!(isPwaBuild()&&!isStandalone());}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;syncInstallBtn();});
window.addEventListener('appinstalled',()=>{deferredPrompt=null;syncInstallBtn();toast('App installed');});
async function doInstall(){
  if(deferredPrompt){try{deferredPrompt.prompt();await deferredPrompt.userChoice;}catch(e){}deferredPrompt=null;syncInstallBtn();return;}
  const ua=navigator.userAgent||'';const ios=/iPhone|iPad|iPod/.test(ua)||(/Macintosh/.test(ua)&&navigator.maxTouchPoints>1);
  const and=/Android/.test(ua);
  let body;
  if(ios)body='<ol><li>Open this page in <b>Safari</b> (not inside another app).</li><li>Tap the <b>Share</b> button (square with an arrow).</li><li>Choose <b>Add to Home Screen</b>, then <b>Add</b>.</li></ol><p class="muted">It then opens full-screen like an app and works offline.</p>';
  else if(and)body='<ol><li>Open this page in <b>Chrome</b>.</li><li>Tap the menu <b>⋮</b> (top right).</li><li>Choose <b>Install app</b> (or <b>Add to Home screen</b>).</li></ol><p class="muted">It appears in your app drawer with its own icon and works offline.</p>';
  else body='<ol><li>In <b>Chrome</b> or <b>Edge</b>, click the install icon at the right end of the address bar (or menu ⋮ → <b>Install GI Hub</b>).</li><li>In Safari on Mac: File → <b>Add to Dock</b>.</li></ol><p class="muted">It then opens in its own window and works offline.</p>';
  modal('<h3 style="margin-top:0">Install as an app</h3>'+body+'<div class="row" style="margin-top:10px"><button class="btn primary" data-a="closeModal">Got it</button></div>');
}
function themeLbl(){return S.theme==='auto'?'◐':S.theme==='light'?'☀':'☾';}
function init(){
  try{if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)&&document.querySelector('link[rel=manifest]'))navigator.serviceWorker.register('sw.js').catch(()=>{});}catch(e){}
  load();applyTheme();
  const t=$('[data-a="theme"]');if(t)t.textContent=themeLbl();
  syncInstallBtn();
  render();
  if(!storageOK)toast('Browser storage is unavailable – use Export to keep your edits.');
}
init();

</script>
